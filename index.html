    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          // Garantir que Infinity da tabela IRT seja restaurado (JSON serializa Infinity como null)
          if (parsed.params && parsed.params.irtTable2026) {
            parsed.params.irtTable2026.forEach(row => {
              if (row.max === null) row.max = Infinity;
            });
          }
          return parsed;
        }
      } catch (e) {
        console.error('Erro ao carregar localStorage:', e);
      }
      return JSON.parse(JSON.stringify(INITIAL_STATE));
    }

    function saveState() {
      try {

    // Formatação Moeda Kwanza (AOA)
    function formatKz(value) {
      const num = Number(value) || 0;
      return num.toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' Kz';
    }

    function formatDatePT(dateStr) {
      if (!dateStr) return '—';
      const [y, m, d] = dateStr.split('-');
      return `${d}/${m}/${y}`;
    }

    function changePeriod(newPeriod) {

    // =========================================================================
    // 3. MOTOR DE CÁLCULO LEGAL DE ANGOLA (LGT 12/23 + IRT 2026 + INSS)
    // =========================================================================

    /**
     * Fórmula Exata do Salário-Hora - Art. 237.º n.º 7 da LGT (Lei n.º 12/23)
     * S/H = (Sm * 12) / (52s * Hs)
     */
    function calcHourlyRate(baseSalary, weeklyHours = 44) {
      return (baseSalary * 12) / (52 * (weeklyHours || 44));
    }

    /**
     * Cálculo Progressivo do IRT 2026 (OGE 2026 / Lei n.º 14/25)
     */
    function calculateIRT2026(taxableIncome) {
      if (taxableIncome <= 0) {
        return { tax: 0, bracket: state.params.irtTable2026[0], excess: 0 };
      }
      const table = state.params.irtTable2026;
      let bracket = table[0];
      for (let i = 0; i < table.length; i++) {
        const max = table[i].max === null ? Infinity : table[i].max;
        if (taxableIncome >= table[i].min && taxableIncome <= max) {
          bracket = table[i];
          break;
        }
      }
      if (bracket.taxa === 0) {
        return { tax: 0, bracket, excess: 0 };
      }
      const excess = Math.max(0, taxableIncome - bracket.excesso);
      const tax = bracket.fixa + (excess * bracket.taxa);
      return { tax: Math.round(tax * 100) / 100, bracket, excess };
    }

    /**
     * Processa a Folha Salarial de um Trabalhador na Competência Atual
     */
    function calculateEmployeePayroll(emp) {
      const p = state.params;
      const att = state.attendance[emp.id] || {
        ot50: 0, ot75: 0, ot100: 0, nightHours: 0,
        justifiedDays: 0, unjustifiedDays: 0, advanceDeduction: 0, includeVacationBonus: false
      };

      const hourlyRate = calcHourlyRate(emp.baseSalary, emp.weeklyHours);
      const dailyHours = (emp.weeklyHours || 44) / 5.5; // média diária padrão 8h

      // 1. Desconto por Faltas Injustificadas (Art. 240.º n.º 2)
      const absenceHours = (att.unjustifiedDays || 0) * dailyHours;
      const absenceDeduction = Math.round(absenceHours * hourlyRate * 100) / 100;
      const effectiveBaseSalary = Math.max(0, emp.baseSalary - absenceDeduction);

      // 2. Horas Extras e Adicional Noturno (Art. 182.º e 188.º LGT)
      const ot50Pay = (att.ot50 || 0) * hourlyRate * 1.50;
      const ot75Pay = (att.ot75 || 0) * hourlyRate * 1.75;
      const ot100Pay = (att.ot100 || 0) * hourlyRate * 2.00;
      const nightPay = (att.nightHours || 0) * hourlyRate * 0.20; // +20% adicional noturno
      const totalOvertimePay = Math.round((ot50Pay + ot75Pay + ot100Pay + nightPay) * 100) / 100;

      // 3. Subsídios Legais Anuais (Férias / Natal) se aplicável na competência
      const vacationBonusPay = att.includeVacationBonus ? (emp.baseSalary * p.vacationBonusPct) : 0;
      const isDecember = state.period.endsWith('-12');
      // Proporcionalidade Subsídio de Natal no ano de 2026
      const monthsWorked2026 = getMonthsWorkedInYear(emp.admissionDate, 2026);
      const christmasBonusPay = isDecember ? Math.round(((emp.baseSalary * p.christmasBonusPct) / 12) * monthsWorked2026 * 100) / 100 : 0;

      // 4. Subsídios Mensais
      const foodAllowance = Number(emp.foodAllowance) || 0;
      const transportAllowance = Number(emp.transportAllowance) || 0;
      const familyAllowance = Number(emp.familyAllowance) || 0;
      const leadershipAllowance = Number(emp.leadershipAllowance) || 0;

      // Total Remuneração Bruta (Base de Incidência INSS)
      const grossSalary = Math.round((
        effectiveBaseSalary +
        totalOvertimePay +
        foodAllowance +
        transportAllowance +
        familyAllowance +
        leadershipAllowance +
        vacationBonusPay +
        christmasBonusPay
      ) * 100) / 100;

      // 5. Segurança Social (INSS: 3% Trabalhador + 8% Entidade Empregadora sobre Bruto)
      const inssWorker = Math.round(grossSalary * p.inssWorkerRate * 100) / 100;
      const inssEmployer = Math.round(grossSalary * p.inssEmployerRate * 100) / 100;

      // 6. Parcelas Isentas de IRT (Código do IRT)
      const exemptFood = Math.min(foodAllowance, p.foodExemptCap);
      const exemptTransport = Math.min(transportAllowance, p.transportExemptCap);
      const exemptFamily = Math.min(familyAllowance, emp.baseSalary * p.familyAllowancePct);
      const totalExemptions = exemptFood + exemptTransport + exemptFamily;

      // 7. Matéria Coletável IRT
      const taxableIncome = Math.max(0, Math.round((grossSalary - totalExemptions - inssWorker) * 100) / 100);

      // 8. Cálculo IRT 2026
      const irtResult = calculateIRT2026(taxableIncome);
      const irtTax = irtResult.tax;

      // 9. Outros Descontos (Adiantamentos - limite 25% do líquido parcial Art. 248.º n.º 7)
      const netBeforeAdvance = grossSalary - inssWorker - irtTax;
      const maxLegalDeduction = Math.round(netBeforeAdvance * 0.25 * 100) / 100;
      const requestedAdvance = Number(att.advanceDeduction) || 0;
      const appliedAdvance = Math.min(requestedAdvance, maxLegalDeduction);
      const advanceCapped = requestedAdvance > maxLegalDeduction;

      const totalDeductions = Math.round((inssWorker + irtTax + appliedAdvance) * 100) / 100;
      const netSalary = Math.max(0, Math.round((grossSalary - totalDeductions) * 100) / 100);

      return {
        emp,
        att,
        hourlyRate,
        absenceDeduction,
        effectiveBaseSalary,
        ot50Pay,
        ot75Pay,
        ot100Pay,
        nightPay,
        totalOvertimePay,
        foodAllowance,
        transportAllowance,
        familyAllowance,
        leadershipAllowance,
        vacationBonusPay,
        christmasBonusPay,
        grossSalary,
        inssWorker,
        inssEmployer,
        exemptFood,
        exemptTransport,
        exemptFamily,
        totalExemptions,
        taxableIncome,
        irtBracket: irtResult.bracket,
        irtExcess: irtResult.excess,
        irtTax,
        requestedAdvance,
        appliedAdvance,
        maxLegalDeduction,
        advanceCapped,
        totalDeductions,
        netSalary
      };
    }

    function getActiveEmployees() {
      return state.employees.filter(e => e.status !== 'Cessado');
    }

    function getMonthsWorkedInYear(admissionDateStr, year) {
      const adm = new Date(admissionDateStr + 'T00:00:00');
      if (adm.getFullYear() < year) return 12;
      if (adm.getFullYear() > year) return 0;
      // Contam meses completos (dia <= 15 conta mês cheio para efeitos práticos)
      const startMonth = adm.getDate() <= 15 ? adm.getMonth() : adm.getMonth() + 1;
      return Math.max(0, 12 - startMonth);
    }

    function calculateSeniority(admissionDateStr, endDateStr) {
      const start = new Date(admissionDateStr + 'T00:00:00');
      const end = new Date(endDateStr + 'T00:00:00');
      if (end < start) return { totalMonths: 0, years: 0, remMonths: 0, roundedYearsLGT: 0 };

      let totalMonths = (end.getFullYear() - start.getFullYear()) * 12 + (end.getMonth() - start.getMonth());
      if (end.getDate() < start.getDate()) totalMonths--;
      totalMonths = Math.max(0, totalMonths);

      const years = Math.floor(totalMonths / 12);
      const remMonths = totalMonths % 12;
      // Regra exata do Art. 311.º da LGT: fração >= 3 meses conta como 1 ano completo
      const roundedYearsLGT = years + (remMonths >= 3 ? 1 : 0);

      return { totalMonths, years, remMonths, roundedYearsLGT };
    }

    function getEntitledVacationDays(emp) {
      const adm = new Date(emp.admissionDate + 'T00:00:00');
      const refYear = 2026;
      if (adm.getFullYear() < refYear) {
        return 22; // Art. 204.º n.º 1: 22 dias úteis por ano civil
      }
      // Ano de admissão: 2 dias úteis por mês completo, mínimo 6 dias úteis após 6 meses (Art. 204.º n.º 2)
      const months = getMonthsWorkedInYear(emp.admissionDate, refYear);
      if (months < 6) return 0;
      return Math.max(6, months * 2);
    }

    function saveEmployeeForm(event, isEdit) {
      event.preventDefault();
      const fd = new FormData(event.target);
      const ibanVal = fd.get('iban').trim().toUpperCase();
      if (!ibanVal.startsWith('AO06') || ibanVal.length < 21) {
        showToast('Atenção: O IBAN angolano deve iniciar por AO06 e conter 25 caracteres alfanuméricos.', 'warning');
      }

      const empData = {
        id: fd.get('id'),
        name: fd.get('name').trim(),
        bi: fd.get('bi').trim().toUpperCase(),
        nif: fd.get('nif').trim(),
        inss: fd.get('inss').trim(),
        birthDate: fd.get('birthDate'),
        maritalStatus: fd.get('maritalStatus'),
        nationality: fd.get('nationality'),
        bank: fd.get('bank'),
        iban: ibanVal,
        role: fd.get('role').trim(),
        maptssCode: fd.get('maptssCode').trim(),
        department: fd.get('department').trim(),
        contractType: fd.get('contractType'),
        admissionDate: fd.get('admissionDate'),
        contractEndDate: fd.get('contractEndDate'),
        probationDays: Number(fd.get('probationDays')),
        weeklyHours: Number(fd.get('weeklyHours')) || 44,
        status: fd.get('status'),
        baseSalary: Number(fd.get('baseSalary')) || 0,
        foodAllowance: Number(fd.get('foodAllowance')) || 0,
        transportAllowance: Number(fd.get('transportAllowance')) || 0,
        familyAllowance: Number(fd.get('familyAllowance')) || 0,
        leadershipAllowance: Number(fd.get('leadershipAllowance')) || 0,
        vacationDaysTaken: isEdit ? (state.employees.find(e => e.id === fd.get('id'))?.vacationDaysTaken || 0) : 0
      };

      if (isEdit) {
        const idx = state.employees.findIndex(e => e.id === empData.id);
        if (idx !== -1) state.employees[idx] = empData;
        showToast(`Ficha de ${empData.name} actualizada com sucesso!`, 'success');
      } else {
        state.employees.push(empData);
        state.attendance[empData.id] = { ot50: 0, ot75: 0, ot100: 0, nightHours: 0, justifiedDays: 0, unjustifiedDays: 0, advanceDeduction: 0, includeVacationBonus: false };
        showToast(`Trabalhador ${empData.name} admitido no quadro de pessoal!`, 'success');
      }

      saveState();
      closeModal();
      renderCurrentRoute();
    }

      showModal(`Minuta de Contrato de Trabalho — ${emp.name}`, `

            </table>

    function updateAttendance(empId, field, rawVal) {
      if (!state.attendance[empId]) {
        state.attendance[empId] = { ot50: 0, ot75: 0, ot100: 0, nightHours: 0, justifiedDays: 0, unjustifiedDays: 0, advanceDeduction: 0, includeVacationBonus: false };
      }
      state.attendance[empId][field] = Math.max(0, Number(rawVal) || 0);
      saveState();
      renderCurrentRoute();
      showToast('Registo de assiduidade actualizado na folha.', 'info');
    }

    // Exportações Oficiais (CSV / TXT PS2)
    function triggerDownload(filename, content, mime = 'text/plain;charset=utf-8') {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportAGT_IRT() {
      const rows = getActiveEmployees().map(e => calculateEmployeePayroll(e));
      let csv = 'NIF_TRABALHADOR;NOME_COMPLETO;REMUNERACAO_BRUTA_AOA;SUBSIDIOS_ISENTOS_AOA;INSS_3PCT_AOA;MATERIA_COLECTAVEL_AOA;IRT_RETIDO_AOA\n';
      rows.forEach(r => {
        csv += `${r.emp.nif};"${r.emp.name}";${r.grossSalary.toFixed(2)};${r.totalExemptions.toFixed(2)};${r.inssWorker.toFixed(2)};${r.taxableIncome.toFixed(2)};${r.irtTax.toFixed(2)}\n`;

    function exportINSS() {
      const rows = getActiveEmployees().map(e => calculateEmployeePayroll(e));

    function exportBankPS2() {
      const rows = getActiveEmployees().map(e => calculateEmployeePayroll(e));
      const totalNet = rows.reduce((a, b) => a + b.netSalary, 0);
      let txt = `PS2|HEADER|${state.company.nif}|${state.company.name.toUpperCase()}|${state.period}|AOA|${rows.length}|${totalNet.toFixed(2)}\n`;
      rows.forEach((r, idx) => {
        txt += `PS2|DETAIL|${String(idx + 1).padStart(4, '0')}|${r.emp.iban}|${r.emp.bank}|${r.emp.name.toUpperCase()}|${r.netSalary.toFixed(2)}|SALARIO ${state.period}\n`;
      });
      txt += `PS2|TRAILER|${rows.length}|${totalNet.toFixed(2)}\n`;
      triggerDownload(`Remessa_Salarial_PS2_EMIS_${state.period}.txt`, txt);
      showToast('Ficheiro Interbancário PS2 (EMIS Angola) gerado para transferência!', 'success');
    }

    function calculateFinalSettlement(emp, exitDateStr, reason, unfulfilledNoticeDays = 0) {
      const seniority = calculateSeniority(emp.admissionDate, exitDateStr);
      const exitDate = new Date(exitDateStr + 'T00:00:00');
      const dayOfMonth = exitDate.getDate();
      const workedDaysInExitMonth = Math.min(30, dayOfMonth);

      // 1. Saldo salário no mês da saída
      const dailyRate = emp.baseSalary / 30;
      const proRataSalary = Math.round(dailyRate * workedDaysInExitMonth * 100) / 100;

      // 2. Férias vencidas não gozadas
      const entitled = getEntitledVacationDays(emp);
      const unusedVestedDays = Math.max(0, entitled - (emp.vacationDaysTaken || 0));
      const dailyBusinessRate = emp.baseSalary / 22;
      const vestedVacationPay = Math.round(unusedVestedDays * dailyBusinessRate * 100) / 100;

      // 3. Férias proporcionais no ano da saída (2 dias úteis por mês completo - Art. 212.º n.º 2)
      const monthsWorkedExitYear = exitDate.getMonth() + (dayOfMonth >= 15 ? 1 : 0);
      const proportionalVacationDays = monthsWorkedExitYear * 2;
      const proportionalVacationPay = Math.round(proportionalVacationDays * dailyBusinessRate * 100) / 100;

      // 4. Gratificação de Férias proporcional & Subsídio de Natal proporcional (Art. 238.º n.º 3)
      const proportionalVacationBonus = Math.round(((emp.baseSalary * state.params.vacationBonusPct) / 12) * monthsWorkedExitYear * 100) / 100;
      const proportionalChristmasBonus = Math.round(((emp.baseSalary * state.params.christmasBonusPct) / 12) * monthsWorkedExitYear * 100) / 100;

      // 5. Indemnização Legal por Motivo (Art. 307.º a 310.º LGT)
      const Y = seniority.roundedYearsLGT;
      let indemnityAmount = 0;
      let indemnityFormulaLabel = 'Não aplicável';
      let legalBasisNote = '';

      switch (reason) {
        case 'PERIODO_EXPERIMENTAL':
          indemnityAmount = 0;
          indemnityFormulaLabel = '0 Kz (Art. 18.º n.º 4)';
          legalBasisNote = 'Cessação livre durante o período experimental sem aviso prévio nem indemnização.';
          break;
        case 'DEMISSAO_TRABALHADOR':
          indemnityAmount = 0;
          indemnityFormulaLabel = '0 Kz (Iniciativa do Trabalhador)';
          legalBasisNote = 'Denúncia pelo trabalhador com aviso prévio de 30 dias (Art. 305.º LGT).';
          break;
        case 'JUSTA_CAUSA_DISCIPLINAR':
          indemnityAmount = 0;
          indemnityFormulaLabel = '0 Kz (Art. 281.º / 282.º)';
          legalBasisNote = 'Despedimento disciplinar após processo formal com entrevista prévia (Art. 88.º).';
          break;
        case 'OBJETIVA_ECONOMICA':
          // Art. 308.º: 100% salário-base até 5 anos + 50% por ano acima de 5 anos
          const first5 = Math.min(Y, 5) * emp.baseSalary;
          const above5 = Math.max(0, Y - 5) * (emp.baseSalary * 0.50);
          indemnityAmount = first5 + above5;
          indemnityFormulaLabel = `100% até 5 anos + 50% > 5 anos (${Y} anos)`;
          legalBasisNote = 'Despedimento por causas económicas/tecnológicas — Aviso prévio 30d e comunicação à IGT (Art. 285.º).';
          break;
        case 'ILICITO_INDIRETO':
          // Art. 310.º: 100% salário-base × anos, mínimo garantido de 3 salários-base
          indemnityAmount = Math.max(emp.baseSalary * 3, emp.baseSalary * Y);
          indemnityFormulaLabel = `100% × ${Y} anos (mín. 3 salários-base - Art. 310.º)`;
          legalBasisNote = 'Indemnização por despedimento ilícito sem reintegração ou rescisão indirecta pelo trabalhador.';
          break;
        case 'INSOLVENCIA_EXTINCAO':
          // Art. 307.º: 50% salário-base × anos
          indemnityAmount = (emp.baseSalary * 0.50) * Y;
          indemnityFormulaLabel = `50% × ${Y} anos (Art. 307.º)`;
          legalBasisNote = 'Caducidade do contrato por insolvência ou extinção da entidade empregadora.';
          break;
        case 'MUTUO_ACORDO':
          indemnityAmount = (emp.baseSalary * 0.50) * Y;
          indemnityFormulaLabel = `Acordo Negociado (Ref. 50% × ${Y} anos)`;
          legalBasisNote = 'Revogação bilateral reduzida a escrito e assinada em duplicado (Art. 280.º).';
          break;
      }

      // Desconto aviso prévio em falta (Art. 305.º n.º 2)
      const noticePenaltyDeduction = reason === 'DEMISSAO_TRABALHADOR'
        ? Math.round((emp.baseSalary / 30) * Math.min(30, Math.max(0, unfulfilledNoticeDays)) * 100) / 100
        : 0;

      // Tributação sobre verbas remuneratórias (indemnizações legais são isentas de INSS/IRT até o limite legal)
      const taxableRemunerationPart = proRataSalary + vestedVacationPay + proportionalVacationPay + proportionalVacationBonus + proportionalChristmasBonus;
      const inssDeduction = Math.round(taxableRemunerationPart * state.params.inssWorkerRate * 100) / 100;
      const irtDeduction = calculateIRT2026(Math.max(0, taxableRemunerationPart - inssDeduction)).tax;

      const grossTotal = taxableRemunerationPart + indemnityAmount;
      const netTotal = Math.max(0, Math.round((grossTotal - noticePenaltyDeduction - inssDeduction - irtDeduction) * 100) / 100);

      return {
        emp,
        exitDateStr,
        seniority,
        workedDaysInExitMonth,
        proRataSalary,
        unusedVestedDays,
        vestedVacationPay,
        monthsWorkedExitYear,
        proportionalVacationDays,
        proportionalVacationPay,
        proportionalVacationBonus,
        proportionalChristmasBonus,
        indemnityAmount,
        indemnityFormulaLabel,
        legalBasisNote,
        noticePenaltyDeduction,
        inssDeduction,
        irtDeduction,
        grossTotal,
        netTotal
      };
    }

              <tr><td class="border border-slate-300 p-2 font-sans">Compensação / Indemnização Legal</td><td class="border border-slate-300 p-2 text-right">${formatKz(s.indemnityAmount)}</td></tr>
              ${s.noticePenaltyDeduction > 0 ? `<tr class="text-rose-700"><td class="border border-slate-300 p-2 font-sans">(-) Desconto Aviso Prévio em Falta</td><td class="border border-slate-300 p-2 text-right">-${formatKz(s.noticePenaltyDeduction)}</td></tr>` : ''}
              <tr><td class="border border-slate-300 p-2 font-sans">(-) INSS Trabalhador (3%)</td><td class="border border-slate-300 p-2 text-right">-${formatKz(s.inssDeduction)}</td></tr>
              <tr><td class="border border-slate-300 p-2 font-sans">(-) Retenção IRT (2026)</td><td class="border border-slate-300 p-2 text-right">-${formatKz(s.irtDeduction)}</td></tr>
              <tr class="bg-slate-900 text-white font-bold text-sm">
                <td class="border border-slate-900 p-2.5 font-sans uppercase">Total Líquido a Pagar (IBAN: ${emp.iban})</td>
                <td class="border border-slate-900 p-2.5 text-right">${formatKz(s.netTotal)}</td>
              </tr>
            </tbody>
          </table>

          <p class="text-[11px] text-slate-600 pt-2">Declaro que recebi da entidade empregadora acima identificada a importância líquida de <strong>${formatKz(s.netTotal)}</strong>, dando plena e geral quitação de todos os créditos emergentes do Contrato de Trabalho cessado, nos termos do artigo 316.º da Lei n.º 12/23.</p>

          <div class="grid grid-cols-2 gap-12 pt-10 text-center">
            <div><div class="border-t border-slate-800 pt-2 font-bold">A ENTIDADE EMPREGADORA</div></div>
            <div><div class="border-t border-slate-800 pt-2 font-bold">O(A) TRABALHADOR(A)</div></div>
          </div>
        </div>
      `, true);
    }

    function printWorkCertificate(empId) {
      const emp = state.employees.find(e => e.id === empId);
      if (!emp) return;
      const c = state.company;

      showModal(`Certificado de Trabalho (Art. 275.º LGT) — ${emp.name}`, `
        <div id="print-area" class="bg-white text-slate-900 p-10 rounded-xl font-serif text-sm leading-relaxed space-y-6">
          <div class="text-center border-b-2 border-slate-800 pb-4">
            <h2 class="text-xl font-bold uppercase tracking-widest">CERTIFICADO DE TRABALHO</h2>
            <p class="text-xs font-sans text-slate-600 mt-1">Emitido em cumprimento obrigatório do Artigo 275.º da Lei Geral do Trabalho (Lei n.º 12/23)</p>
          </div>

          <p class="pt-4">Para os devidos efeitos legais, <strong>${c.name}</strong>, pessoa colectiva contribuinte fiscal n.º <strong>${c.nif}</strong>, com sede social em ${c.address}, certifica que o(a) cidadão(ã) <strong>${emp.name}</strong>, portador(a) do Bilhete de Identidade n.º <strong>${emp.bi}</strong>, beneficiário(a) da Segurança Social n.º <strong>${emp.inss}</strong>, esteve ao serviço desta entidade empregadora no período compreendido entre <strong>${formatDatePT(emp.admissionDate)}</strong> e <strong>${formatDatePT(termFormState.exitDate)}</strong>.</p>

          <p>Durante a vigência do referido Contrato de Trabalho, o(a) trabalhador(a) exerceu com regularidade as funções correspondentes à categoria profissional de <strong>${emp.role}</strong> (Qualificador Ocupacional MAPTSS: ${emp.maptssCode}), afecto(a) ao departamento de ${emp.department}.</p>

          <p>Por ser verdade e nos termos do n.º 2 do artigo 275.º da Lei n.º 12/23 não conter quaisquer referências desabonatórias, passa-se o presente Certificado de Trabalho, que vai devidamente assinado e autenticado com o carimbo a óleo em uso nesta empresa.</p>

          <p class="pt-6">Luanda, ${formatDatePT(termFormState.exitDate)}.</p>

          <div class="pt-12 text-center font-sans text-xs w-72 mx-auto">
            <div class="border-t border-slate-800 pt-2 font-bold uppercase">A Direcção de Recursos Humanos</div>
            <div class="text-slate-600">${c.name}</div>
          </div>
        </div>
      `, true);
    }

    // =========================================================================
    // 11. MÓDULO 7: PARÂMETROS LEGAIS & FISCAIS (OGE 2026 / LGT)
    // =========================================================================
    function renderSettings(container) {
      const p = state.params;

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Parâmetros Fiscais & Legais (OGE / LGT)</h2>
            <p class="text-sm text-slate-400">Tabelas parametrizáveis para actualização anual conforme o Orçamento Geral do Estado de Angola.</p>
          </div>
          <button onclick="saveFiscalParams()" class="px-5 py-2.5 rounded-xl gold-gradient text-obsidian font-bold text-xs shadow-lg hover:opacity-95 flex items-center gap-2 self-start">
            <i class="fa-solid fa-floppy-disk"></i> Guardar Parâmetros
          </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <!-- Parâmetros Gerais -->
          <div class="card-surface rounded-2xl p-6 space-y-4 text-sm">
            <h3 class="font-bold text-white border-b border-slateBorder pb-2.5">Taxas INSS & Tetos de Isenção</h3>
            
            <div>
              <label class="block text-xs text-slate-400 mb-1">Quota Trabalhador INSS (%)</label>
              <input type="number" id="param-inss-worker" step="0.1" value="${(p.inssWorkerRate * 100).toFixed(1)}" class="input-dark w-full px-3 py-2 rounded-xl font-mono" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Quota Entidade Empregadora INSS (%)</label>
              <input type="number" id="param-inss-employer" step="0.1" value="${(p.inssEmployerRate * 100).toFixed(1)}" class="input-dark w-full px-3 py-2 rounded-xl font-mono" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Teto Isenção Subsídio Alimentação (Kz)</label>
              <input type="number" id="param-food-cap" step="1000" value="${p.foodExemptCap}" class="input-dark w-full px-3 py-2 rounded-xl font-mono" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Teto Isenção Subsídio Transporte (Kz)</label>
              <input type="number" id="param-trans-cap" step="1000" value="${p.transportExemptCap}" class="input-dark w-full px-3 py-2 rounded-xl font-mono" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs text-slate-400 mb-1">Gratif. Férias (%)</label>
                <input type="number" id="param-vac-pct" min="50" max="100" value="${(p.vacationBonusPct * 100).toFixed(0)}" class="input-dark w-full px-3 py-2 rounded-xl font-mono" />
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">Sub. Natal (%)</label>
                <input type="number" id="param-xmas-pct" min="50" max="100" value="${(p.christmasBonusPct * 100).toFixed(0)}" class="input-dark w-full px-3 py-2 rounded-xl font-mono" />
              </div>
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Salário Mínimo Nacional Referência (Kz)</label>
              <input type="number" id="param-min-wage" step="1000" value="${p.minWageRef}" class="input-dark w-full px-3 py-2 rounded-xl font-mono" />
            </div>
          </div>

          <!-- Tabela Progressiva IRT 2026 -->
          <div class="lg:col-span-2 card-surface rounded-2xl overflow-hidden">
            <div class="p-4 border-b border-slateBorder bg-obsidian/50 flex justify-between items-center">
              <h3 class="font-bold text-sm text-white">Tabela Progressiva do IRT — Grupo A (OGE 2026 / Lei n.º 14/25)</h3>
              <span class="text-xs text-amber-400 font-mono">Valores em Kwanzas (AOA)</span>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs font-mono">
                <thead>
                  <tr class="border-b border-slateBorder bg-obsidian/80 font-sans text-[11px] uppercase text-slate-400">
                    <th class="py-3 px-4">Escalão</th>
                    <th class="py-3 px-3 text-right">De (Kz)</th>
                    <th class="py-3 px-3 text-right">Até (Kz)</th>
                    <th class="py-3 px-3 text-right">Parcela Fixa (Kz)</th>
                    <th class="py-3 px-3 text-right">Taxa (%)</th>
                    <th class="py-3 px-4 text-right">Sobre Excesso de</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slateBorder/50">
                  ${p.irtTable2026.map(row => `
                    <tr class="hover:bg-slateCard/40">
                      <td class="py-2.5 px-4 font-sans font-bold text-slate-200">${row.escalao}.º Escalão</td>
                      <td class="py-2.5 px-3 text-right text-slate-300">${row.min.toLocaleString('pt-PT')}</td>
                      <td class="py-2.5 px-3 text-right text-slate-300">${row.max === Infinity ? 'Sem limite' : row.max.toLocaleString('pt-PT')}</td>
                      <td class="py-2.5 px-3 text-right text-purple-300 font-semibold">${row.fixa.toLocaleString('pt-PT')}</td>
                      <td class="py-2.5 px-3 text-right text-amber-400 font-bold">${(row.taxa * 100).toFixed(1)}%</td>
                      <td class="py-2.5 px-4 text-right text-slate-400">${row.excesso.toLocaleString('pt-PT')}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function saveFiscalParams() {
      state.params.inssWorkerRate = (Number(document.getElementById('param-inss-worker').value) || 3) / 100;
      state.params.inssEmployerRate = (Number(document.getElementById('param-inss-employer').value) || 8) / 100;
      state.params.foodExemptCap = Number(document.getElementById('param-food-cap').value) || 30000;
      state.params.transportExemptCap = Number(document.getElementById('param-trans-cap').value) || 30000;
      state.params.vacationBonusPct = Math.max(0.5, (Number(document.getElementById('param-vac-pct').value) || 50) / 100);
      state.params.christmasBonusPct = Math.max(0.5, (Number(document.getElementById('param-xmas-pct').value) || 50) / 100);
      state.params.minWageRef = Number(document.getElementById('param-min-wage').value) || 70000;

      saveState();
      showToast('Parâmetros fiscais e trabalhistas actualizados!', 'success');
    }

    // =========================================================================
    // 12. CONFIGURAÇÃO DA EMPRESA & MODAIS
    // =========================================================================
    function openCompanyModal() {
      const c = state.company;
      showModal('Dados da Entidade Empregadora (Angola)', `
        <form onsubmit="saveCompanyForm(event)" class="space-y-4 text-sm">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="sm:col-span-2">
              <label class="block text-xs text-slate-400 mb-1">Denominação Social *</label>
              <input type="text" name="name" required value="${c.name}" class="input-dark w-full px-3 py-2 rounded-xl" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">NIF da Empresa (AGT) *</label>
              <input type="text" name="nif" required value="${c.nif}" class="input-dark w-full px-3 py-2 rounded-xl font-mono" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">N.º Contribuinte INSS *</label>
              <input type="text" name="inssEntity" required value="${c.inssEntity}" class="input-dark w-full px-3 py-2 rounded-xl font-mono" />
            </div>
            <div class="sm:col-span-2">
              <label class="block text-xs text-slate-400 mb-1">Endereço do Centro de Trabalho (Luanda) *</label>
              <input type="text" name="address" required value="${c.address}" class="input-dark w-full px-3 py-2 rounded-xl" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Actividade Económica (CAE)</label>
              <input type="text" name="sector" value="${c.sector}" class="input-dark w-full px-3 py-2 rounded-xl" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Representante Legal</label>
              <input type="text" name="representative" value="${c.representative}" class="input-dark w-full px-3 py-2 rounded-xl" />
            </div>
          </div>
          <div class="flex justify-end gap-3 pt-4 border-t border-slateBorder">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slateCard text-slate-300">Cancelar</button>
            <button type="submit" class="px-5 py-2 rounded-xl gold-gradient text-obsidian font-bold">Guardar Empresa</button>
          </div>
        </form>
      `);
    }

    function saveCompanyForm(event) {
      event.preventDefault();
      const fd = new FormData(event.target);
      state.company = {
        name: fd.get('name').trim(),
        nif: fd.get('nif').trim(),
        inssEntity: fd.get('inssEntity').trim(),
        address: fd.get('address').trim(),
        sector: fd.get('sector').trim(),
        representative: fd.get('representative').trim()
      };
      saveState();
      closeModal();
      renderCurrentRoute();
      showToast('Dados da entidade empregadora actualizados!', 'success');
    }

    function showModal(title, htmlContent, allowPrint = false) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = htmlContent;
      const printBtn = document.getElementById('modal-print-btn');
      if (allowPrint) {
        printBtn.classList.remove('hidden');
      } else {
        printBtn.classList.add('hidden');
      }
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    // Fechar modal ao clicar fora
    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });

    // Inicialização
    window.addEventListener('DOMContentLoaded', () => {
      updateHeaderUI();
      navigate('dashboard');
    });
  </script>
</body>
</html>
